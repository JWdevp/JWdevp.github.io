    <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c10" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jason Wiersum" />
    <meta property="og:title" content="Jason Wiersum — Portfolio" />

      property="og:description"

    />
    <meta property="og:locale" content="es" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jason Wiersum — Portfolio" />

      name="twitter:description"
      content="Anwendungsentwickler (IHK) en Nürnberg con background en diseño industrial. Software · Diseño · Creatividad."
    />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      Applies the stored theme before first paint so the page never flashes the
      wrong background. Mirrors the default in src/hooks/useTheme.tsx (light).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jw-theme')
          var theme = stored === 'dark' || stored === 'light' ? stored : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
        try {
          var lang = localStorage.getItem('jw-language')
          if (lang === 'es' || lang === 'en' || lang === 'de') {
            document.documentElement.lang = lang
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
